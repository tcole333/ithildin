name: Lint Agent Docs

on:
  pull_request:
    paths:
      - ".claude/skills/**"
      - ".claude/commands/**"
      - ".codex/skills/**"
      - "docs/**"
      - "research/**"
      - "scripts/validate_skills.py"
      - "scripts/lint_agent_docs.sh"
  push:
    branches:
      - main
    paths:
      - ".claude/skills/**"
      - ".claude/commands/**"
      - ".codex/skills/**"
      - "docs/**"
      - "research/**"
      - "scripts/validate_skills.py"
      - "scripts/lint_agent_docs.sh"

jobs:
  lint-agent-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Run validator
        run: |
          uv run python scripts/validate_skills.py \
            --workspace "$GITHUB_WORKSPACE" \
            --skills-dir "$GITHUB_WORKSPACE/.claude/skills" \
            --skills-dir "$GITHUB_WORKSPACE/.codex/skills" \
            --commands-dir "$GITHUB_WORKSPACE/.claude/commands" \
            --docs-dir "$GITHUB_WORKSPACE/docs" \
            --docs-dir "$GITHUB_WORKSPACE/research" \
            --strict
