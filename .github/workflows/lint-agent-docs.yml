name: Lint Agent Docs

on:
  pull_request:
    paths:
      - ".claude/skills/**"
      - ".claude/commands/**"
      - ".codex/skills/**"
      - ".agents/**"
      - "docs/**"
      - "research/**"
      - "scripts/**"
      - "tools/**"
  push:
    branches:
      - main
    paths:
      - ".claude/skills/**"
      - ".claude/commands/**"
      - ".codex/skills/**"
      - ".agents/**"
      - "docs/**"
      - "research/**"
      - "scripts/**"
      - "tools/**"

jobs:
  lint-agent-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Run validator
        run: bash scripts/lint_agent_docs.sh --strict
