name: Python Tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Run all deterministic Python regressions
        run: uv run --locked python -m pytest --offline --require-critical-tests -m "not live_data" -q
