name: Python Tests

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 8 * * *"

jobs:
  pr-fast-tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Run unittest suite
        run: uv run python -m unittest discover -s tests -v

      - name: Run deterministic pytest integration suite
        run: uv run pytest -m "integration and not live_data" -q

  nightly-integration:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Run nightly integration scope
        run: uv run pytest -m "integration or live_data" -q
