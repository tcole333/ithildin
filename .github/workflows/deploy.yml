name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: node scripts/check-path-contract.mjs

      - run: npm ci
        working-directory: web

      - run: python3 scripts/financial_quality.py gate --scope publish --strict --with-math --json > financial-quality-gate.json
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: financial-quality-gate
          path: financial-quality-gate.json

      - run: python3 scripts/review_dossier_checks.py gate --json > dossier-review-gate.json
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dossier-review-gate
          path: dossier-review-gate.json

      - run: npm run lint:citations
        working-directory: web

      - run: python3 scripts/check_dossier_evidence_sync.py

      - run: npm run lint:citations:changed -- --base-ref "${{ github.event.before }}" --head-ref "${{ github.sha }}"
        working-directory: web

      - run: npm run test:citations
        working-directory: web

      - run: npm run test:citations:snapshots
        working-directory: web

      - run: npm run report:support-coverage
        working-directory: web

      - run: npm run report:support-coverage:changed -- --base-ref "${{ github.event.before }}" --head-ref "${{ github.sha }}"
        working-directory: web

      - run: python3 pipeline/export_search_index.py
      - run: python3 pipeline/export_preview_index.py

      - run: PUBLIC_ENABLE_EVIDENCE_MODE=false npm run build
        working-directory: web

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist/ --project-name=ithildin --branch=main --commit-dirty=true
