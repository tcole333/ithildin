name: Validate and Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-main
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: node scripts/check-path-contract.mjs
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Validate reviewed inputs and stage exact publication artifact
        run: uv run --locked python scripts/validate_release.py validate --artifact-dir "${{ runner.temp }}/publication"
      - uses: actions/upload-artifact@v4
        with:
          name: publication-${{ github.sha }}
          path: ${{ runner.temp }}/publication/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: publication-${{ github.sha }}
          path: ${{ runner.temp }}/publication/
      - name: Verify artifact before upload
        run: uv run --locked python scripts/validate_release.py verify-artifact --artifact-dir "${{ runner.temp }}/publication"
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ runner.temp }}/publication/site/ --project-name=ithildin --branch=main --commit-dirty=true
