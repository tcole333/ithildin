# Brad S. Karp Investigation Profile

name: "brad-karp"
primary_subject: "Brad S. Karp"
description: >
  Person-centric investigation of former Paul, Weiss chairman Brad S. Karp,
  tracing his documented relationships, legal mandates, information flows,
  referral networks, private-investigation contacts, political activity,
  corporate roles, and February 2026 departure from firm leadership. The
  investigation tests where personal communications overlapped client matters
  or professional duties while distinguishing documented contact from claims
  of confidentiality, privilege, or ethics breaches that require mandate- and
  client-specific primary evidence.

