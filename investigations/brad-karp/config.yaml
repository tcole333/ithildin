threads:
  - id: 1
    name: "Karp-Epstein Direct Relationship"
    description: "Reconstruct direct emails, calls, calendars, meals, introductions, family contacts, and in-person meetings between Karp and Epstein, with exact dates and canonical document references. Contact alone is not evidence of misconduct."
    targets:
      - "brad karp"
      - "brad s. karp"
      - "jeffrey epstein"
      - "lesley groff"
      - "kathryn ruemmler"
      - "michael wolff"
      - "darren indyke"
    keywords:
      - "brad(ley)?\\s+(s\\.?\\s+)?karp"
      - "karp.*epstein|epstein.*karp"
      - "9\\s+(east|e)\\s+71|dinner|lunch|breakfast|calendar"
      - "friend(s|ship)?|coming\\s+solo|woody\\s+allen"

  - id: 2
    name: "Paul Weiss Mandates and Information Flows"
    description: "Map Paul, Weiss representations and Karp communications matter by matter, identify the client and engagement scope, and test whether information shared outside each team was public, authorized, confidential, privileged, or operational."
    targets:
      - "paul weiss"
      - "paul, weiss, rifkind, wharton & garrison"
      - "alan halperin"
      - "greg ezring"
      - "scott barshay"
      - "richard zabel"
    keywords:
      - "paul[,]?\\s*weiss|\\bpw\\b"
      - "attorney.client|privileg|confidential|engagement|retainer|client"
      - "matter|mandate|conflict|waiver|informed consent"
      - "general counsel|outside counsel|legal advice"

  - id: 3
    name: "Apollo Black Tax and Financial Network"
    description: "Trace Karp and Paul, Weiss work involving Leon Black, Apollo and its co-founders, including tax remediation, service agreements, escrow proposals, Caesars-related exchanges, professional-fee allocation, and later internal-review scope."
    targets:
      - "leon black"
      - "apollo global management"
      - "marc rowan"
      - "joshua harris"
      - "brad wechsler"
      - "alan halperin"
      - "patrick fenn"
      - "steven pesner"
      - "bob bodian"
      - "dechert"
    keywords:
      - "apollo|leon\\s+black|black\\s+family"
      - "8865|8858|5471|reasonable\\s+cause"
      - "escrow|service\\s+agreement|aiken|akin\\s+gump|deloitte|pwc"
      - "caesars|athene|phaidon|tax\\s+(letter|filing|remediation)"

  - id: 4
    name: "SoftBank Ghosn and Transnational Legal Channel"
    description: "Reconstruct the 2018-2019 Ghosn and SoftBank/Misra exchanges among Karp, Epstein, Reid Weingarten and related actors; identify each law firm's mandate and the sources, direction, timing, and use of nonpublic information."
    targets:
      - "carlos ghosn"
      - "rajeev misra"
      - "softbank"
      - "nissan"
      - "renault"
      - "reid weingarten"
      - "ron soffer"
      - "steptoe"
    keywords:
      - "ghosn|ghosen|nissan|renault|tokyo"
      - "softbank|rajeev\\s+misra|softbank\\s+caper"
      - "weingarten|ron\\s+soffer|steptoe"
      - "on\\s+call\\s+with\\s+doj|my\\s+guy|re\\s+db"

  - id: 5
    name: "Private Investigations and Reputation Operations"
    description: "Identify Karp's use, recommendation, or coordination of private investigators and crisis teams, including Nardello and Kroll references, and distinguish ordinary litigation support from surveillance, intelligence collection, or reputation operations."
    targets:
      - "nardello & co"
      - "nardello"
      - "kroll"
      - "guzel ganieva"
      - "david boies"
      - "kathy boies"
    keywords:
      - "nardello|kroll|private\\s+investigator|investigators"
      - "surveillance|covert|recording|transcript|subjects"
      - "crisis\\s+management|reputation|opposition\\s+research"
      - "ganieva|boies"

  - id: 6
    name: "Corporate Referral Property and Family Network"
    description: "Map Karp's board and corporate roles, professional referrals, property records, philanthropy-related introductions, and family-linked entities while resolving same-name people before making connections."
    targets:
      - "xero"
      - "richard merkin"
      - "heritage provider network"
      - "bill & melinda gates foundation"
      - "bill gates"
      - "connie collingsworth"
      - "greg ezring"
      - "roberta karp"
      - "david karp"
      - "meredith karp"
    keywords:
      - "xero|board\\s+(seat|member|call)|director"
      - "gates\\s+foundation|donor.advised|greg\\s+ezring|collingsworth"
      - "richard\\s+merkin|heritage\\s+(group|provider)"
      - "115\\s+central\\s+park\\s+west|10\\s+park\\s+avenue|executor|deed|acr[i]?s"

  - id: 7
    name: "Political Influence Public Accountability and Succession"
    description: "Verify Karp's campaign-finance activity, political and institutional relationships, Paul, Weiss's March 2025 executive-order settlement, public explanations of the released correspondence, leadership succession, and Karp's post-chair roles."
    targets:
      - "scott barshay"
      - "donald trump"
      - "paul weiss"
      - "federal election commission"
    keywords:
      - "campaign\\s+contribution|donor|bundler|actblue|fec"
      - "executive\\s+order|settlement|40\\s+million|pro\\s+bono"
      - "resign|step(ped)?\\s+down|chair|succession|barshay"
      - "statement|apology|ethics|disciplin|investigation"

corpus_tools:
  - tool: "tools/ingest_kabasshouse.py"
    name: "Kabasshouse Epstein Corpus"
    description: "Primary full-text source for released DOJ, FBI, and House records; first stop for Karp-Epstein document searches"
    commands: ["search", "doc", "entity", "financials", "curated"]
  - tool: "tools/query_unified.py"
    name: "Unified Epstein Relationship Database"
    description: "Structured relationship, email, entity, and co-occurrence layer"
    commands: ["emails", "docs", "entities", "triples", "cooccurrence"]
  - tool: "tools/query_lmsband.py"
    name: "LMSBAND Structured Epstein Data"
    description: "Complementary structured financial, flight, balance, and position data; duplicate EFTA pages are not independent corroboration"
    commands: ["search", "entities", "file"]
  - tool: "tools/ingest_epstein_20k.py"
    name: "House Oversight Epstein Files"
    description: "House Oversight document release with HOUSE_OVERSIGHT canonical IDs"
    commands: ["search"]
  - tool: "tools/ingest_fbi_files.py"
    name: "FBI Epstein Files"
    description: "FBI releases and named exhibits, including EFTA records and contact/flight material"
    commands: ["search", "overlap"]
  - tool: "tools/reporting_corpus.py"
    name: "Epstein Reporting Knowledge Layer"
    description: "Versioned secondary reporting and attributed claims; use for leads and promote only after primary-evidence review"
    commands: ["search", "claims", "sources", "promote"]

