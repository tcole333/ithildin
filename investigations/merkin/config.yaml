  and social connections to Jeffrey Epstein and Epstein-adjacent investment
  networks. Map Merkin's Ascot, Gabriel, and Ariel structures and his Madoff,
  Cerberus, GMAC, and nonprofit relationships without treating network proximity
  or appearance in released records as evidence of misconduct.

