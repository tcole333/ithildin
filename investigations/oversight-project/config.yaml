# The Oversight Project / Mike Howell — Corporate Network & Infrastructure Investigation

name: "oversight-project"

primary_subject: "The Oversight Project (Mike Howell)"

description: >
  Investigation of The Oversight Project — a government-accountability / FOIA-
  litigation operation that launched (circa 2022) as a project of the Heritage
  Foundation and was subsequently incorporated as an independent Wyoming entity
  with a DC/Virginia office at 211 North Union Street, Alexandria, VA 22314.
  Executive Director: Mike Howell. The Wyoming incorporation was reportedly
  handled by attorney William M. Klimon (Caplin & Drysdale), who also appears on
  filings for a cluster of aligned nonprofits at 300 Independence Avenue SE,
  Washington, DC 20003 — the Conservative Partnership Institute (CPI) building —
  including the American Accountability Foundation and, potentially, the CUFI
  Action Fund. Scope: corporate structure and the Heritage spin-out, leadership
  and revolving-door ties, the CPI shared-services ecosystem, funding and grant
  flows, digital infrastructure (certificates, DNS, hosting), and litigation /
  political activity. All specifics below are seeds to verify against primary
  sources (WY SOS, VA SCC, IRS 990s, FEC, court records, crt.sh, Shodan).

