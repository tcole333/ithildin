# Smartbird / Allbirds / NewBird AI — GPU Pivot Forensics
# Investigating the April 15, 2026 rebrand of Allbirds (BIRD) from a failing
# sustainable footwear company to "NewBird AI," a purported GPU-as-a-Service
# provider, followed by the current SEC registrant name Smartbird, Inc.
# Pattern-matches classic
# distressed-company-to-hot-sector pump (compare: Long Blockchain 2017).

name: "allbirds"

primary_subject: "Smartbird, Inc. (NASDAQ: BIRD; formerly Allbirds, Inc.; announced as NewBird AI)"

description: >
  Financial forensics investigation of Smartbird, Inc. (NASDAQ: BIRD; SEC CIK
  0001653909), formerly Allbirds, Inc., and the April 15, 2026 "NewBird AI"
  rebrand announcement — a pivot from struggling sustainable footwear retailer
  to purported "GPU-as-a-Service" AI compute provider.
  The announcement triggered a ~600% one-day stock surge (from ~$3 to ~$16.99)
  on a $50M convertible financing from an undisclosed institutional investor.
  Investigation focuses on: (1) who is the undisclosed convertible counterparty
  and what are the conversion terms; (2) insider trading around the March 30
  shoe-asset-sale and April 15 AI-pivot announcements; (3) the role of placement
  agent Chardan Capital Markets (SEC-sanctioned 2018 for penny-stock SAR
  failures) and whether this exhibits toxic/death-spiral financing hallmarks;
  (4) how the pattern compares to Long Island Iced Tea -> Long Blockchain Corp
  (2017), which resulted in SEC insider-trading charges against three
  individuals and delisting in 2021. CIK: 0001785450. Ticker: BIRD.
  Delaware incorporation; HQ San Francisco, CA. Current SEC submissions identify
  the registrant as Smartbird, Inc.; Allbirds and NewBird AI remain historical
  search aliases.

