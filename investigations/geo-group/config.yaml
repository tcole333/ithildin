# The GEO Group — Government Contract and Corporate Network Investigation

name: "geo-group"

primary_subject: "The GEO Group, Inc. (NYSE: GEO)"

description: >
  Broad investigation of The GEO Group, Inc., its subsidiaries, executives,
  facilities, financing, political network, litigation, and government-facing
  operations. The priority workstream is a transaction-level reconstruction of
  Immigration and Customs Enforcement (ICE) awards: recipient aliases and UEIs,
  parent/child and local pass-through contracts, facilities, vehicles, task
  orders, modifications, subcontractors, procurement offices, performance,
  oversight findings, lobbying, and policy-linked timing.
  Public-company identifiers: CIK 0000923796; SEC file 1-14260; EIN 65-0043078.

