# Curaleaf — ownership, offshore financing, sanctions, licensing, and federal-investigation review

name: "curaleaf"

primary_subject: "Curaleaf Holdings, Inc."

description: >
  Evidence-led investigation of Curaleaf Holdings, Inc. (CIK 0001756770;
  TSX: CURA; OTCQX: CURLF), its controlling shareholders, offshore financing
  vehicles, share pledges and repurchase transactions, related-party network,
  cannabis-license ownership disclosures, and released FBI records. The
  initial commission tests reporting by The Newsground concerning federal
  money-laundering/public-corruption investigative activity and Credit Bank of
  Moscow's realization of Curaleaf shares, while pursuing independently
  newsworthy contradictions and control questions. No article allegation is
  treated as established without primary evidence.

