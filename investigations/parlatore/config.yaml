threads:
  - id: 1
    name: "Pentagon Reserve Loophole"
    description: "Naval Reserve commissioning that lets Parlatore work inside DoD under Hegseth without leaving private practice. Reservist status, JAG Corps assignment, ethics waivers, conflict-of-interest screening, security clearance, billet and chain of command."
    targets: ["pete hegseth", "peter hegseth", "joe kasper"]
    keywords: ["naval reserve", "reservist", "jag corps", "direct commission", "secdef", "secretary of defense", "ethics waiver", "office of general counsel", "ogc"]
  - id: 2
    name: "Pentagon Litigation Conflicts"
    description: "Cases where Parlatore Law Group represents clients suing or in disputes with DoD, the services, or military officials while Parlatore simultaneously holds a Pentagon role. Court records, BCNR/BCMR cases, military justice appeals, FOIA litigation."
    targets: []
    keywords: ["board for correction", "bcnr", "bcmr", "court of federal claims", "uniform code of military justice", "ucmj", "general court-martial", "tucker act", "feres", "mandamus"]
  - id: 3
    name: "Officer Promotion Pay-to-Play"
    description: "Allegations that officers seeking promotion or favorable Pentagon outcomes have retained Parlatore. Promotion board interventions, flag officer reviews, Senate-confirmation holds, fitness reports."
    targets: []
    keywords: ["promotion board", "flag officer", "fitness report", "fitrep", "oer", "selection board", "senate confirmation", "nomination"]
  - id: 4
    name: "Trump Legal Network"
    description: "Parlatore's tenure on Trump's legal team for the Mar-a-Lago classified documents matter (2023), interactions with Boris Epshteyn, reasons for departure, ongoing relationships with Trump-orbit lawyers and clients."
    targets: ["donald trump", "boris epshteyn", "evan corcoran", "jim trusty", "alina habba", "todd blanche"]
    keywords: ["mar-a-lago", "classified documents", "espionage act", "save america pac"]
  - id: 5
    name: "High-Profile Military Defense"
    description: "Representation of Eddie Gallagher (Navy SEAL war crimes), Clint Lorance, Matthew Golsteyn, Robert O'Neill, and other military clients. Patterns in client selection, fee arrangements, public-facing media strategy."
    targets: ["eddie gallagher", "edward gallagher", "clint lorance", "matthew golsteyn", "robert o'neill"]
    keywords: ["seal team", "war crimes", "trident review", "court-martial", "pardon", "navy seal"]
  - id: 6
    name: "Parlatore Law Group Operations"
    description: "Firm structure, partners, associates, of-counsel relationships, jurisdictional registrations, billing practices, marketing, media appearances on CNN/MSNBC/Fox."
    targets: []
    keywords: ["parlatore law group", "pllg", "parlatore pllc", "of counsel", "law partner", "associate"]
  - id: 7
    name: "Hegseth Pentagon Inner Circle"
    description: "Hegseth's appointees, advisors, and personal staff at DoD; the broader 'Concerned Veterans for America' / Fox News alumni network now placed across the Pentagon. Parlatore's relationships with these figures."
    targets: ["pete hegseth", "joe kasper", "dan caldwell", "darin selnick"]
    keywords: ["concerned veterans for america", "cva", "fox and friends weekend", "secdef chief of staff", "senior advisor", "deputy chief of staff"]

