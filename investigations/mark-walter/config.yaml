# Mark Walter — Finance, Insurance, Liquidity, Sports, and Institutional Network

name: "mark-walter"

primary_subject: "Mark Walter"

description: >
  Evidence-led investigation of Mark Walter and the financial, insurance, sports,
  philanthropic, and institutional network around him. The priority is to verify
  the nature and status of reported federal, securities, and state scrutiny of
  Walter-associated businesses; reconstruct related-party lending and any
  resulting liquidity pressure; test whether rapid sports-asset transactions,
  including the proposed 2026 Lakers sale, are connected to financing needs; and
  map charities, grants, trusteeships, boards, conflicts, and related transactions.
  Reports of investigations and possible fraud are allegations unless and until
  supported by primary records or an adjudication.

