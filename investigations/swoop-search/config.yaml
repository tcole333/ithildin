# Investigation profile: Swoop Search / Swoop Technologies and the Golden Dome
# command-and-control software group.

name: swoop-search

primary_subject: "Swoop Search, LLC / Swoop Technologies, LLC (SwoopOS)"

description: >-
  Who is the company behind SwoopOS, reported by Reuters (2026-03-24, citing one
  source) as "Swoop Technologies", one of five firms in the original Golden Dome
  command-and-control software group with Anduril, Palantir, Aalyria and Scale AI,
  and how did it get that work? Covers the Swoop Search / Swoop Technologies entity
  lineage, founders and investors, federal contracting history and award vehicle,
  the formation of the Golden Dome C2 consortium, and political or lobbying ties.
  Golden Dome program-level facts already live in the tech-right profile
  (thread 13); cite those findings rather than re-deriving them.

# Lowercase names that escalate auto-lead priority when they appear as entity
# officers. Expand after the identity wave resolves founders and executives.
key_persons:
  - "paul bottum"
  - "michael guetlein"
  - "steve feinberg"
  - "stephen feinberg"
  - "emil michael"

known_addresses:
  "2877 itasca ave": "SAM.gov physical and mailing address of Swoop Technologies, LLC (UEI WVT6SJYYJFC5, CAGE 76XE1), Lakeland, MN 55043"

threads:
  - id: 1
    name: "Swoop entity identity and corporate lineage"
    description: "Swoop Search, LLC vs Swoop Technologies, LLC: formation, conversions, name changes, parent/subsidiary structure, registered agents, addresses, SAM/CAGE records, trademarks and patents for SwoopOS, Valhalla and Surf, and the pivot from search/analytics to an operating system"
    targets:
      - "swoop search"
      - "swoop technologies"
      - "swoopos"
      - "swooptech"
    keywords:
      - "swoop search"
      - "swoop technologies"
      - "swoop ?os"
      - "swooptech"
      - "valhalla sdk"
      - "wvt6sjyyjfc5"
      - "76xe1"

  - id: 2
    name: "Swoop founders, leadership and personnel"
    description: "Founders, executives, board members, advisors and key hires; their military, intelligence, academic and prior-company backgrounds; cleared workforce; revolving-door movement between Swoop and government"
    targets:
      - "paul bottum"
    keywords:
      - "bottum"
      - "swoop.*(founder|ceo|cto|president|chief)"
      - "(founder|ceo|cto|president|chief).*swoop"

  - id: 3
    name: "Swoop capital, investors and valuation"
    description: "Funding rounds, Form D filings, named investors and their overlap with the defense-tech venture network, state angel tax credit certifications, PPP/SBA loans, grants and valuation signals"
    targets: []
    keywords:
      - "form d"
      - "seed round"
      - "series [a-c]"
      - "angel tax credit"
      - "qualified new business venture"
      - "ppp loan"
      - "swoop.*(invest|funding|raise)"

  - id: 4
    name: "Swoop federal contracting pathway"
    description: "Every federal award, subaward, SBIR/STTR, OTA, consortium membership and IDIQ position keyed to Swoop's identity (UEI WVT6SJYYJFC5 / CAGE 76XE1 and any predecessor), facility clearance, teaming with Anduril or Palantir, and the vehicle through which Golden Dome C2 work reached Swoop"
    targets: []
    keywords:
      - "sbir"
      - "sttr"
      - "other transaction"
      - "\\bota\\b"
      - "subaward"
      - "consortium manager"
      - "shield idiq"
      - "facility clearance"

  - id: 5
    name: "Golden Dome C2 software consortium formation"
    description: "How the Golden Dome command-and-control software group was assembled: the original five (Anduril, Palantir, Aalyria, Scale AI, Swoop), expansion to nine vendors, selection process, contract vehicle, funding, C2 demonstrations and tests, and oversight"
    targets:
      - "aalyria"
      - "scale ai"
    keywords:
      - "golden dome"
      - "command and control"
      - "c2bmc"
      - "glue layer"
      - "guetlein"
      - "drpm"

  - id: 6
    name: "Swoop political, lobbying and influence ties"
    description: "Federal and state lobbying, political contributions by Swoop principals, congressional advocacy and earmarks, links to administration officials, defense-tech forums and investor networks"
    targets: []
    keywords:
      - "lobbying"
      - "lobbyist"
      - "campaign contribution"
      - "earmark"
      - "congressionally directed"

