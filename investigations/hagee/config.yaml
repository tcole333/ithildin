      - "(?i)grassley"
      - "(?i)senate.*finance"
      - "(?i)prosperity.*gospel"
      - "(?i)controversy"
      - "(?i)catholic"
      - "(?i)holocaust"

  - id: 6
    name: "Philanthropic & Humanitarian Operations"
    description: "Charitable giving patterns, Israel-directed aid, humanitarian projects, Exodus II aliyah operations, relationship with Israeli charities and settlements."
    targets:
      - "exodus"
      - "aliyah"
    keywords:
      - "(?i)philanthrop"
      - "(?i)charit"
      - "(?i)aliyah"
      - "(?i)exodus"
      - "(?i)settlement"
      - "(?i)humanitarian"
      - "(?i)grant"

  - id: 7
    name: "Governance & Board Interlocks"
    description: "Board composition across Hagee entities, family governance, overlapping directorships, compensation committee structures, related-party governance."
    targets:
      - "john hagee"
      - "diana hagee"
      - "matt hagee"
    keywords:
      - "(?i)board.*director"
      - "(?i)trustee"
      - "(?i)officer"
      - "(?i)compensation"
      - "(?i)related.*party"
      - "(?i)interlock"
      - "(?i)governance"

