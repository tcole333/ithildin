# Investigation Profile: John Hagee
# Pastor, Christian Zionist leader, media empire, political influence network

name: "hagee"

primary_subject: "John Hagee"

description: "Investigation of Pastor John Hagee's financial empire, political influence network, and institutional infrastructure spanning Cornerstone Church, Christians United for Israel (CUFI), John Hagee Ministries, and affiliated entities. Focus on financial flows, real estate holdings, political relationships, and cross-entity governance."

key_persons:
  - "john hagee"
  - "diana hagee"          # wife, co-pastor, board member across entities
  - "matt hagee"           # son, lead pastor of Cornerstone Church
  - "kendal hagee"         # son, involved in ministry operations
  - "christopher hagee"    # son, involved in ministry media
  - "sandy hagee"          # daughter
  - "martha hagee"         # first wife (divorced 1975)
  - "david brog"           # former CUFI executive director
  - "shari dollinger"      # CUFI leadership
  - "gary bauer"           # CUFI board, political operative
  - "george morrison"      # CUFI leadership
  - "victor mordecai"      # associate, Israeli affairs
  - "rod parsley"          # allied pastor, political ally
  - "john mccain"          # rejected Hagee endorsement 2008
  - "mike pompeo"          # political ally, CUFI speaker
  - "ted cruz"             # political ally, CUFI speaker
  - "mike huckabee"        # political ally, CUFI speaker
  - "ron dermer"           # Israeli ambassador, CUFI relationship
  - "benjamin netanyahu"   # Israeli PM, CUFI relationship

known_addresses:
  "cornerstone": "Cornerstone Church campus, San Antonio TX"
  "san antonio": "Hagee base of operations"
  "5515 usaa": "Cornerstone Church area, San Antonio TX"
  "global evangelism": "Global Evangelism Television offices"
  "the dominion": "Upscale San Antonio neighborhood, Hagee residence area"

threads:
