    name: "Hagee Ministry Financial Empire"
    description: "Financial structure of John Hagee Ministries, Cornerstone Church, Global Evangelism Television, and affiliated 501(c)(3) entities. Compensation, real estate, related-party transactions."
    targets:
      - "john hagee"
      - "diana hagee"
      - "matt hagee"
      - "cornerstone church"
      - "john hagee ministries"
      - "global evangelism"
      - "hagee communications"
    keywords:
      - "(?i)hagee"
      - "(?i)cornerstone.*church"
      - "(?i)global evangelism"
      - "(?i)501\\(c\\)"
      - "(?i)parsonage"
      - "(?i)clergy.*housing"

  - id: 2
    name: "CUFI Political Machine"
    description: "Christians United for Israel — lobbying arm, political endorsements, campaign contributions, Congressional influence, annual summits, relationship with Israeli government."
    targets:
      - "christians united for israel"
      - "cufi"
      - "cufi action fund"
      - "david brog"
      - "gary bauer"
      - "shari dollinger"
    keywords:
      - "(?i)christians united"
      - "(?i)cufi"
      - "(?i)israel.*lobby"
      - "(?i)pro.israel"
      - "(?i)aipac"
      - "(?i)zionist"

