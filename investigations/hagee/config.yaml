    name: "Media & Broadcasting Empire"
    description: "Television ministry, TBN relationships, Daystar, book publishing, media production companies, broadcast licensing, digital media."
    targets:
      - "global evangelism television"
      - "tbn"
      - "daystar"
      - "hagee communications"
    keywords:
      - "(?i)broadcast"
      - "(?i)television.*ministry"
      - "(?i)tbn"
      - "(?i)daystar"
      - "(?i)charisma.*media"
      - "(?i)book.*deal"

  - id: 4
    name: "Real Estate & Asset Holdings"
    description: "Church properties, parsonage exemptions, ranch properties, personal real estate holdings of Hagee family in Bexar County and beyond."
    targets:
      - "john hagee"
      - "diana hagee"
      - "cornerstone church"
    keywords:
      - "(?i)real estate"
      - "(?i)property"
      - "(?i)parsonage"
      - "(?i)ranch"
      - "(?i)bexar.*county"
