# Investigation profile: cross-border political clipping and astroturfing network

name: "elephant-clipping"

primary_subject: "Elephant Clipping / ClipIt political clipping operation"

description: >-
  Evidence-led investigation of the cross-border paid video-clipping network
  described by The Atlantic on September 2, 2026, including its vendors,
  funders, content suppliers, distribution accounts, political beneficiaries,
  cloud-document provenance, payment flows, and disclosure practices.

key_persons:
  - "serviuos"
  - "blake wynn"
  - "steve wynn"
  - "anders wedøe"
  - "anders wedoe"
  - "jules katz"
  - "benjamin goodman"
  - "jack o'hara"
  - "charlie kirk"
  - "erika kirk"
  - "andrew kolvet"
  - "vivek ramaswamy"
  - "tulsi gabbard"
  - "ben shapiro"
  - "steven crowder"
  - "nick shirley"

# No street address from the seed article is treated as verified. Agents should
# add registry-sourced offices and addresses as they resolve the legal entities.
known_addresses: {}

threads:
  - id: 1
    name: "Core Operation, Sponsorship & Payments"
    description: >-
      Resolve Elephant Clipping, ClipIt, Serviuos, Monster Lab, campaign budgets,
      payment rails, ultimate customers, and the source and disposition of funds.
    targets:
      - "elephant clipping"
      - "clipit"
      - "serviuos"
      - "serviuos.com"
      - "monster lab"
    keywords:
      - 'elephant clipping|clipit|serviuos|monster lab'
      - 'campaign budget|payout|payment rail|views? per month|clipper'

  - id: 2
    name: "Enclave & Key / Wynn Network"
    description: >-
      Map Enclave & Key, its brands or operating units, officers, employees, clients, Wynn
      family relationships, political access, and any role in supplying or
      commissioning campaign content.
    targets:
      - "enclave & key"
      - "b wynn sports llc"
      - "celebrity poker tour"
      - "blake wynn"
      - "steve wynn"
      - "jules katz"
      - "benjamin goodman"
      - "jack o'hara"
    keywords:
      - 'enclave\s*(?:&|and)\s*key|blake wynn|steve wynn'
      - 'jules katz|benjamin goodman|jack o.hara'

  - id: 3
    name: "Latvian & Norwegian Vendor Chain"
    description: >-
      Resolve the legal entities, principals, domains, contractors, and business
      histories behind ClipIt, ClipSon, US Politics Clipping, and their operators
      in Latvia, Norway, and other contractor jurisdictions.
    targets:
      - "clipson"
      - "clipson wedøe"
      - "us politics clipping"
      - "anders wedøe"
      - "anders wedoe"
      - "riga"
    keywords:
      - 'clipson|us politics clipping|anders wed(?:ø|o)e'
      - 'latvia|latvian|riga|norway|norwegian'

  - id: 4
    name: "Cloud Documents & Content Provenance"
    description: >-
      Recover and authenticate publicly shared Google Drive/Docs/Sheets/Forms and
      other cloud artifacts; preserve IDs, uploader metadata, filenames, dates,
      revisions, link graphs, and archival traces without bypassing access controls.
    targets:
      - "google drive"
      - "google docs"
      - "google sheets"
      - "google forms"
    keywords:
      - 'drive\.google\.com|docs\.google\.com|forms\.gle'
      - 'uploaded by|owner|revision|folder id|document id|content library'

  - id: 5
    name: "Distribution Accounts & Coordination"
    description: >-
      Enumerate participating TikTok, Instagram, YouTube, and other accounts;
      test claimed reach; identify coordinated posting, reused assets, proxy use,
      payment markers, and disclosure patterns.
    targets:
      - "_politicalhub"
      - "frontrawpolitics"
      - "tiktok"
      - "instagram"
      - "youtube"
      - "lonealphapolitics"
      - "theusdebatearena"
      - "newzinsights"
      - "politi.cszone"
      - "rightsideamerica2026"
      - "usavoiceclips"
      - "rightrepublican.view"
      - "cnsrvtvperspective"
      - "politics_decoded11"
      - "politics.ts"
      - "politicsthree60"
      - "politics.fx"
      - "dailyusapolitics"
      - "uspoliticsclipsz"
      - "politics.vm"
      - "politics.vs"
      - "dailypolitics2026"
      - "truth.inpolitics"
      - "republicanrisexhq"
      - "mr.debaterz.street"
      - "clips.crowder"
      - "crowderclipssz"
      - "debatecrowder"
      - "freedomwire_1"
    keywords:
      - '_politicalhub|frontrawpolitics'
      - 'tiktok|instagram reels|youtube shorts|proxy server'
      - 'goal of the campaign|coordinated posting|paid partnership|disclosure'

  - id: 6
    name: "Political Clients, Targets & Beneficiaries"
    description: >-
      Determine who requested, funded, supplied, approved, or benefited from each
      campaign involving Turning Point USA, the Wynns, political figures, and
      conservative media personalities; preserve denials and competing explanations.
    targets:
      - "turning point usa"
      - "vivek ramaswamy"
      - "tulsi gabbard"
      - "ben shapiro"
      - "steven crowder"
      - "erika kirk"
      - "nick shirley"
    keywords:
      - 'turning point usa|tpusa|charlie kirk|erika kirk'
      - 'vivek ramaswamy|tulsi gabbard|ben shapiro|steven crowder|nick shirley'
      - 'client|beneficiar|commission|sponsor|content supplier'

  - id: 7
    name: "Disclosure, Election Law & Platform Rules"
    description: >-
      Test campaign-finance, advertising, consumer-protection, foreign-national,
      tax, contractual, and platform-policy implications. Distinguish deliberate
      rule avoidance from lawful editorial restrictions and ordinary brand safety.
    targets:
      - "federal election commission"
      - "federal trade commission"
      - "meta"
      - "tiktok"
      - "youtube"
    keywords:
      - 'fec|ftc|campaign finance|foreign national|independent expenditure'
      - 'sponsored content|material connection|disclosure|terms of service'
      - 'vote for|vote against|donate|prohibited subject|brand safety'

