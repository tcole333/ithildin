# Eastport Cinemas / Eastport Shopping Center investigation profile

name: "eastport-cinemas"

primary_subject: "Eastport Cinemas / Eastport Shopping Center redevelopment site, Annapolis, Maryland"

description: >-
  Property, ownership, and redevelopment investigation into the long-vacant
  Eastport Cinemas building and the Eastport Shopping Center site identified by
  Maryland accounts 020600004896700 and 020600004896706. The investigation
  traces record and beneficial ownership, the 2004 cinema closure, superseded
  and current redevelopment proposals, and the legal, financial, environmental,
  physical, and market explanations for delayed construction.

key_persons:
  - "daniel lederberg"
  - "dan lederberg"
  - "alex kopicki"
  - "charles liff"

known_addresses:
  "915 chesapeake avenue": "City project address for the former-cinema redevelopment area, Annapolis, MD"
  "919 chesapeake avenue": "Historical cinema address reported by theater and business directories, Annapolis, MD"
  "925 chesapeake avenue": "Dry-cleaner portion of MDE environmental-covenant area MD1282, Annapolis, MD"
  "1023 bay ridge avenue": "Current shopping-center address variant, Annapolis, MD"
  "7315 wisconsin avenue": "Eastport Plaza LLC owner mail routed care of L & L Investments, Bethesda, MD"
  "5215 chesapeake avenue": "Unsupported Cinema Treasures/user-supplied legacy alias; no current official Maryland parcel match"
  "eastport shopping center": "Shopping-center name associated with accounts 020600004896700 and 020600004896706, Annapolis, MD"

