  - id: 3
    name: "Redevelopment Proposals and Planning History"
    description: "Trace every proposed reuse or redevelopment, its sponsors, approvals, opposition, revisions, withdrawal, denial, or lapse."
    targets:
      - "eastport cinemas"
      - "eastport shopping center"
      - "lofts at eastport landing"
      - "solstice partners llc"
      - "spre eastport llc"
      - "sdp2018-006"
      - "pd2016-002"
    keywords:
      - "redevelop|development|site plan|concept plan|variance|special exception|rezoning|mixed.use|application|withdrawn|denied|expired"

  - id: 4
    name: "Land Use, Permits, and Public Constraints"
    description: "Assess zoning, permits, code enforcement, environmental, access, parking, utility, flood, and municipal or county constraints."
    targets:
      - "5215 chesapeake avenue"
      - "915 chesapeake avenue"
      - "925 chesapeake avenue"
      - "md1282"
      - "sdp2018-006"
    keywords:
      - "zoning|permit|inspection|code|violation|environment|stormwater|flood|traffic|parking|utility|access|annapolis|anne arundel"

  - id: 5
    name: "Financing, Liens, Taxes, and Litigation"
    description: "Identify mortgages, assignments, liens, tax status, foreclosure risk, bankruptcy, contracts, and disputes affecting the property or owner."
    targets:
      - "eastport cinemas"
      - "eastport shopping center"
      - "eastport plaza llc"
      - "eastport plaza limited partnership"
    keywords:
      - "mortgage|deed of trust|assignment|lien|ucc|tax|foreclos|bankrupt|lawsuit|litigation|default|receivership"

  - id: 6
    name: "Market, Community, and Political Context"
    description: "Evaluate surrounding land values and uses, neighborhood priorities, public statements, lobbying, campaign ties, and economic feasibility claims."
    targets:
      - "eastport cinemas"
      - "eastport shopping center"
    keywords:
      - "community|neighborhood|eastport|hearing|testimony|council|alderman|campaign|lobby|market|appraisal|feasibility"

corpus_tools: []

key_dates:
  - date: "1996-01-25"
    event: "Charles Liff dies; the public Montgomery County nonprobate-estate index does not identify beneficiaries or successors"
    category: "legal"

  - date: "2001-11-20"
    event: "SDAT records a non-arm's-length transfer from Eastport Plaza Limited Partnership to Eastport Plaza LLC under deed 10983/410"
    category: "financial"

  - date: "2017-07-14"
    event: "Annapolis Planning Director requires revision of the original 127-unit redevelopment proposal's density methodology"
    category: "legal"

  - date: "2018-11-26"
    event: "Annapolis approves SDP2018-006 for a revised 98-unit mixed-use redevelopment"
    category: "milestone"

  - date: "2020-03-17"
    event: "Annapolis Board of Appeals vacates and remands the initial adequacy-of-public-facilities certification"
    category: "legal"

  - date: "2022-05-02"
    event: "Circuit Court partly reverses and partly affirms the APF ruling, leaving stormwater, police, and auto-transportation issues"
    category: "legal"

  - date: "2023-06-30"
    event: "City reissues APF certification with binding police, traffic, and stormwater mitigation"
    category: "legal"

  - date: "2025-10-14"
    event: "City grants a one-year extension of SDP2018-006 after evidence of ongoing drawing and permit work"
    category: "milestone"

  - date: "2026-10-16"
    event: "Current displayed expiration date for the SDP2018-006 site-design approval"
    category: "milestone"

