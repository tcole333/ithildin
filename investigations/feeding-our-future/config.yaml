# Feeding Our Future / Minnesota Pandemic Meal Fraud

name: "feeding-our-future"

primary_subject: "Feeding Our Future fraud scheme"

description: >
  Investigation of Feeding Our Future and the broader Minnesota federal child
  nutrition fraud scheme. Focus on sponsor-site networks, shell entities,
  money laundering, state oversight failures, and criminal case progression.
  As of September 4, 2025, DOJ had charged 75 defendants in a scheme alleging
  roughly 91 million fake meals and nearly $250 million stolen from
  pandemic-era federal nutrition programs.

