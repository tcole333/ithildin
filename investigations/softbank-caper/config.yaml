# SoftBank Caper Investigation Profile
# Formalized 2026-06-22 from prior research/ + content/ work (previously filed under the
# epstein profile). Centers on the SoftBank Vision Fund private-order network and extends
# it with the WeWork financial-extraction thesis.
#
# IMPORTANT: The WeWork "looting" thesis and the Epstein/Weingarten "planning" angle are
# USER-PROVIDED hypotheses. Treat as investigative leads requiring primary-source
# verification (SEC filings, court dockets), NOT established fact. The Epstein corpus has
# been searched (Unified/DOJ/LMSBAND/Duggan) and returns NO direct WeWork/Neumann/Schreiber
# linkage — the WeWork connection is structural (shared cast: Misra, Paul Weiss, Weingarten),
# pending an exhaustive re-sweep.

name: softbank-caper
primary_subject: "SoftBank Vision Fund private-order network (Rajeev Misra)"
description: >
  Two linked operations run through the same private rails. (1) THE CAPER (2015-2019):
  a dirty-tricks/smear campaign against SoftBank executives Nikesh Arora and Alok Sama,
  allegedly orchestrated by Rajeev Misra via operative Alessandro Benedetti (~$500K wire
  through a BVI shell), with Jeffrey Epstein documented as an undisclosed back-channel
  between Brad Karp (Paul Weiss, SoftBank counsel) and Reid Weingarten (Steptoe, weighing
  a Misra defense) in a Jan 2019 email window. (2) THE EXTRACTION (2017-2024, WeWork):
  SoftBank put ~$16B into WeWork and lost ~$14B+, while insiders extracted value — Adam
  Neumann (~$1.7B exit incl. a ~$430M NON-RECOURSE loan) and Misra himself, who sat on
  BOTH sides (Vision Fund equity 2017 + his OneIM fund's $470M letter of credit in 2023,
  SoftBank-guaranteed, repaid early for ~$105M profit). Thesis: the same private-order
  machinery that ran the smear ran the looting. Counsel continuity (Paul Weiss) and the
  near-total absence of FARA/LDA/litigation/SAR footprints are core to the pattern.

