# Peru — Lockheed Martin Defense Sale & Political Upheaval
# Investigation into the recent Lockheed Martin aircraft/defense sale to Peru
# and the political upheaval surrounding the procurement decision.

name: "peru-lockheed"

primary_subject: "Lockheed Martin Peru Defense Sale"

description: >
  Investigation of the recent Lockheed Martin defense sale to Peru and the
  surrounding political upheaval — including the Castillo impeachment (2022),
  the Boluarte presidency and her removal, the José Jerí caretaker government,
  and the procurement decision-making chain. Focus areas: who decided, who
  benefited, what intermediaries/lobbyists were involved, FCPA exposure,
  competing bids (Saab Gripen, Dassault Rafale), and financial/political
  beneficiaries. Treat all named procurement officials, intermediaries, and
  Peruvian political figures as unverified until corroborated against
  primary sources.

key_persons:
  # Peru — recent presidents
  - "pedro castillo"          # President 2021-2022, impeached after self-coup attempt
  - "dina boluarte"           # President 2022-2025 (removed), former VP under Castillo
  - "josé jerí"               # Successor president — verify exact role and date
  - "jose jeri"               # ASCII variant
  - "manuel merino"           # Brief 2020 president — context for instability
  - "francisco sagasti"       # 2020-2021 transitional president
  - "martín vizcarra"         # Former president, impeached 2020

  # Peru — defense / procurement chain (verify against primary sources)
  - "walter astudillo"        # Defense Minister under Boluarte (period to verify)
  - "jorge chávez calderón"   # Defense Minister (period to verify)
  - "víctor torres falcón"    # Interior Minister (period to verify)
  - "óscar arriola"           # National Police chief (period to verify)

  # Peru — Air Force (FAP) leadership — agents to populate verified names
  - "comandante general fap"

  # Lockheed Martin — corporate
  - "james taiclet"           # Chairman, President & CEO
  - "frank st. john"          # COO
  - "jay malave"              # CFO
  - "greg ulmer"              # EVP Aeronautics (F-16 program)

  # Competing bidders / counterparties (context)
  - "saab"                    # Gripen E/F bidder
  - "dassault"                # Rafale bidder
  - "embraer"                 # Brazilian counterparty
  - "korea aerospace industries"  # FA-50 bidder

  # Peruvian political figures of interest
  - "vladimir cerrón"         # Perú Libre — Castillo network
  - "betssy chávez"           # Castillo PM — context
  - "nicanor boluarte"        # Dina Boluarte's brother — under investigation in Peru
  - "patricia benavides"      # Suspended Attorney General — judicial politicization

