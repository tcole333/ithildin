  opinion_column: { axis2: media_article, axis3: journalist }
  blog_excerpt: { axis2: media_article, axis3: journalist }
  book_excerpt: { axis2: media_article, axis3: journalist }
  social_media_post: { axis2: media_article, axis3: journalist }
