version: 1
updated: 2026-07-12

archives:
  wayback:
    endpoint: https://web.archive.org/cdx/search/cdx
    mode: automatic
    purpose: Exact-URL version discovery and replay
  commoncrawl:
    endpoint: https://index.commoncrawl.org/collinfo.json
    mode: automatic_fallback
    purpose: Exact-URL WARC recovery when Wayback has no substantive replay
  archive_is:
    endpoint: https://archive.is/
    mode: manual_url_only
    purpose: User-supplied snapshot links; no dependable public API

# The initial backfill scans only Epstein-specific material. Other investigation
# profiles contain thousands of unrelated news links and would pollute this corpus.
repository_seed_paths:
  - investigations/epstein
  - research
  - content/articles
  - content/dossiers

# Reproducible URL inventories for stories that automated discovery misses,
# especially publisher URLs whose paths contain only opaque article IDs.
candidate_seed_files:
  - investigations/epstein/reporting_historical_seed.jsonl
  - investigations/epstein/reporting_multilingual_seed.jsonl
  - investigations/epstein/reporting_early_seed.jsonl
  - investigations/epstein/reporting_palm_beach_post_archive_seed.jsonl
  - investigations/epstein/reporting_historical_2009_2018_seed.jsonl
  - investigations/epstein/reporting_date_backfill_seed.jsonl

