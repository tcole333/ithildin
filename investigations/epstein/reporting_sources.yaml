# Within these tightly scoped files, reporting may be useful operational context
# even when "Epstein" is not repeated in the sentence surrounding the link.
contextual_seed_paths:
  - investigations/epstein
  - research/softbank-caper-evidence.md
  - research/RELATED_INVESTIGATIONS.md

# Discovery terms are intentionally broader than "Jeffrey Epstein". They are
# inputs for periodic searches and licensed-database queries, not factual claims.
search_terms:
  core:
    - '"Jeffrey Epstein"'
    - '"Ghislaine Maxwell" AND Epstein'
    - 'Epstein AND ("Southern Trust" OR "Financial Trust")'
    - 'Epstein AND (JPMorgan OR "Deutsche Bank")'
    - 'Epstein AND (Wexner OR "Leon Black")'
    - 'Epstein AND (USVI OR "Virgin Islands")'
  multilingual:
    - '"Jeffrey Epstein" OR "affaire Epstein"'
    - '"Jeffrey Epstein" OR "caso Epstein"'
    - '"Jeffrey Epstein" OR "Fall Epstein"'
    - '"Jeffrey Epstein" OR "Epstein-saken" OR "Epstein-fallet"'
    - '"Jeffrey Epstein" OR "zaak-Epstein"'
    - '"Jeffrey Epstein" OR "caso Epstein" OR "caso de Epstein"'
    - '"Jeffrey Epstein" OR "Джеффри Эпштейн"'
    - '"Jeffrey Epstein" OR "ג׳פרי אפשטיין"'
    - '"Jeffrey Epstein" OR "جيفري إبستين"'
    - '"Jeffrey Epstein" OR "ジェフリー・エプスタイン"'
    - '"Jeffrey Epstein" OR "제프리 엡스타인"'
    - '"Jeffrey Epstein" OR "杰弗里·爱泼斯坦" OR "愛潑斯坦"'
    - '"Jeffrey Epstein" OR "afera Epsteina"'
    - '"Jeffrey Epstein" OR "Epstein davası"'
    - '"Jeffrey Epstein" OR "Τζέφρι Έπσταϊν"'

