seed_pillars:
  - name: "Federal Trade Commission"
    pillar_type: "government"
    sub_type: "consumer_protection_regulator"
    status: "active"
    jurisdiction: "United States"
    significance: "Primary U.S. regulator for deceptive marketing, negative-option billing, business opportunity claims, and unfair or deceptive acts."

  - name: "Securities and Exchange Commission"
    pillar_type: "government"
    sub_type: "securities_regulator"
    status: "active"
    jurisdiction: "United States"
    significance: "Relevant where creators or affiliated brands make investment, securities, or fundraising claims."

  - name: "Commodity Futures Trading Commission"
    pillar_type: "government"
    sub_type: "commodities_regulator"
    status: "active"
    jurisdiction: "United States"
    significance: "Relevant for forex, commodities, derivatives, and some leveraged trading or signal products."

  - name: "State Attorneys General"
    pillar_type: "government"
    sub_type: "state_consumer_protection"
    status: "active"
    jurisdiction: "United States"
    significance: "Important for consumer-protection actions, refund disputes, and deceptive trade-practice enforcement."

  - name: "YouTube"
    pillar_type: "media"
    sub_type: "video_platform"
    status: "active"
    jurisdiction: "United States"
    significance: "Core discovery and distribution layer for creator brands, archived claims, and funnel traffic."

  - name: "Meta Platforms"
    pillar_type: "media"
    sub_type: "social_platform"
    status: "active"
    jurisdiction: "United States"
    significance: "Key distribution surface for paid traffic, creator branding, and deplatforming/platform-migration signals."

  - name: "Stripe"
    pillar_type: "operations"
    sub_type: "payment_processor"
    status: "active"
    jurisdiction: "United States"
    significance: "Common merchant processor whose presence or removal can reveal product category, risk status, and platform migration."

  - name: "Shopify"
    pillar_type: "operations"
    sub_type: "ecommerce_platform"
    status: "active"
    jurisdiction: "Canada"
    significance: "Frequent ecommerce stack for supplements, merch, and direct-response product storefronts."

  - name: "Telegram"
    pillar_type: "operations"
    sub_type: "messaging_platform"
    status: "active"
    jurisdiction: "Global"
    significance: "Common platform for paid communities, alerts, migration after bans, and gated funnel communication."

  - name: "Discord"
    pillar_type: "operations"
    sub_type: "community_platform"
    status: "active"
    jurisdiction: "United States"
    significance: "Common platform for subscription communities, course access, and monetized community management."

  - name: "Rumble / Locals"
    pillar_type: "media"
    sub_type: "alternative_platform"
    status: "active"
    jurisdiction: "United States"
