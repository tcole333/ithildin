# Manosphere / red-pill monetization ecosystem

name: "manosphere"

primary_subject: "Manosphere monetization ecosystem"

description: >
  Investigation of the online manosphere / red-pill commercial ecosystem:
  creators, paid communities, coaching offers, supplements, crypto or trading
  products, affiliate networks, and the corporate/payment infrastructure that
  supports them. Focus on mapping the ecosystem, testing public commercial
  claims against records, and surfacing leads around deceptive practices,
  hidden ownership, platform migration, and regulatory risk.

