# Election Integrity Release Investigation
# Review of the White House "Election Integrity" document release
# published at https://www.whitehouse.gov/election-integrity/ on 2026-07-16.

name: "election-integrity"

primary_subject: "White House Election Integrity document release (July 2026)"

description: >
  Forensic review of the four document collections released at
  whitehouse.gov/election-integrity on 2026-07-16: declassified IC assessments
  on voting-system vulnerabilities, PRC acquisition of US voter data, FBI files
  on the Michigan (Muskegon/GBI Strategies) voter-registration investigation,
  and a DHS review of noncitizens on state voter rolls. Core question: what do
  the primary documents actually establish, versus the release page's
  characterization? Includes provenance/redaction analysis and downstream
  verification against independent records.

key_persons:
  - "kash patel"

known_addresses: {}

threads:
  - id: 1
    name: "Voting-System Vulnerability Assessments"
    description: "IC/CISA assessments of electronic voting and ballot-counting system vulnerabilities, incl. Venezuela 2020 plot reporting"
    targets:
      - "cisa"
    keywords:
      - "voting machine"
      - "ballot[- ]counting"
      - "election infrastructure"
      - "venezuela"
  - id: 2
    name: "PRC Voter-Data Acquisition"
    description: "Claimed PRC compromise of ~220M US voter files 2018-2024; IC reporting chain and alleged suppression"
    targets: []
    keywords:
      - "prc"
      - "china"
      - "voter data"
      - "voter registration (database|files)"
  - id: 3
    name: "Michigan Voter-Registration Investigation"
    description: "FBI Detroit / MSP investigation of GBI Strategies Muskegon operation; DOJ PIN declinations and delay claims"
    targets:
      - "gbi strategies"
    keywords:
      - "michigan"
      - "muskegon"
      - "gbi"
  - id: 4
    name: "Noncitizen Voter-Roll Review"
    description: "DHS review claiming ~278,000 noncitizens registered; methodology and state coverage"
    targets: []
    keywords:
      - "noncitizen"
      - "non-citizen"
      - "alien voter"
  - id: 5
    name: "Release Provenance and Framing"
    description: "How the release was assembled (PDF metadata, redaction workflow, doc dating), page framing vs document content, newly-authored vs declassified docs"
    targets: []
    keywords:
      - "declass"
      - "redact"
      - "provenance"

