# Document corpus tools specific to this investigation.
# Generic tools (EDGAR, FEC, CourtListener, OpenCorporates registries) are always available.
# These overlap heavily with the /investigations/epstein profile since most Epstein-adjacent
# evidence lives in the same document corpora.
corpus_tools:
  - tool: "tools/query_doj.py"
    name: "DOJ Epstein Files (Volume 11)"
    description: "331K OCR'd pages from DOJ Epstein file releases; canonical EFTA IDs; primary source for IATS escrow file EFTA01339374"
    commands: ["search", "fetch", "names", "count"]
  - tool: "tools/query_lmsband.py"
    name: "LMSBAND"
    description: "60K+ files with 851K entities, cooccurrence analysis"
    commands: ["search", "entity"]
  - tool: "tools/query_unified.py"
    name: "Unified Epstein DB"
    description: "70K documents + 56K entities + 107K triples, integrated emails and documents"
    commands: ["emails", "docs", "entities", "triples"]
  - tool: "tools/query_investigations.py"
    name: "Ingested Court Exhibits (case-specific)"
    description: "PDF-ingested court exhibits including EFTA01339374 (IATS escrow file), Axia Advisors Ex 56 (USVI v JPM), JPM Ex 86 (Hyperion Air DDR)"
    commands: ["search", "list", "show"]
  - tool: "tools/ingest_faa.py"
    name: "FAA Aircraft Registry"
    description: "Full US aircraft registry for N-number lookup, owner search, address search"
    commands: ["search", "n-number", "address"]
  - tool: "tools/query_documentcloud.py"
    name: "DocumentCloud"
    description: "Public DOJ/Epstein archive; project 216915"
    commands: ["search", "document"]
  - tool: "tools/query_muckrock.py"
    name: "MuckRock FOIA"
    description: "FOIA requests; project 507 (Epstein)"
    commands: ["search", "request"]

