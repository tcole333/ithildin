name: "epstein-aetna"

primary_subject: "Aetna-Epstein-Apollo corporate network (N722JE helicopter transaction)"

description: >
  Investigation of the July 2011 sale of Sikorsky S-76C++ N722JE from Jeffrey
  Epstein's shell company Freedom Air International, Inc. to Aetna's wholly-
  owned aviation subsidiary ASI Wings, LLC for $11,900,000 (with $11,800,000
  wired to JPMorgan Chase in Panama), the June 2019 no-consideration transfer
  of the same helicopter back to Epstein's USVI entity Hyperion Air, LLC
  twenty-three days before Epstein's arrest, and the broader Aetna-Epstein-
  Apollo corporate network surfaced by that transaction — including Jeffrey
  D. Benjamin's simultaneous roles as Apollo Global Management Senior Advisor
  and Chiquita Brands Board Audit Committee member (2002-2007) during and
  after Fernando Aguirre's Chiquita CEO tenure, and Aguirre's appointment to
  Aetna's Board and Audit Committee on 2011-07-29 (three days after the
  Panama wire).

