<!doctype html>
<html lang="en">
<head><title>Traffic/Criminal Case Search | Eugene, OR Record Search</title></head>
<body>
<form action="/eugeneor/Cases/Search" method="get">
  <select id="SearchBy" name="SearchBy">
    <option value="Name">Name</option>
    <option value="CitationNumber">Citation Number</option>
    <option value="DocketNumber">Docket Number</option>
    <option value="CaseNumber">PD Case Number</option>
    <option value="VehiclePlate">Vehicle Plate</option>
    <option value="VIN">VIN</option>
  </select>
  <input name="SearchByCriteria.LastName">
  <input name="SearchByCriteria.FirstName">
  <input name="SearchByCriteria.DateOfBirth">
  <input name="SearchByCriteria.DriversLicenseNumber">
  <input name="SearchByCriteria.UseSoundEX">
  <input name="SearchByCriteria.UsePartialNames">
  <input name="SearchByCriteria.CitationNumber">
  <input name="SearchByCriteria.DocketNumber">
  <input name="SearchByCriteria.PDCaseNumber">
  <input name="SearchByCriteria.WarrantNumber">
  <input name="SearchByCriteria.VehiclePlate">
  <select name="SearchByCriteria.VehicleState">
    <option value="">State</option><option value="OR">OR</option>
  </select>
  <input name="SearchByCriteria.VIN">
</form>
</body>
</html>
