<!doctype html>
<html>
  <head><title>User account | Fresno Superior Court Portal</title></head>
  <body>
    <form id="user-register-form" method="post">
      <input type="hidden" name="form_id" value="user_register_form">
      <input class="required" type="text" name="mail">
      <input class="required" type="text" name="conf_mail">
      <input type="text" name="profile_firstName">
      <input class="required" type="text" name="profile_lastName">
      <input class="required" type="text" name="profile_phone">
      <input class="required" type="checkbox" name="terms_of_use">
      <input type="submit" value="Create new account">
    </form>
  </body>
</html>
