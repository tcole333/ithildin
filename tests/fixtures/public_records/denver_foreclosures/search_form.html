<!doctype html>
<html lang="en">
<head><title>Denver Foreclosure Search</title></head>
<body>
<form method="post" action="./default?AspxAutoDetectCookieSupport=1" id="ctl01">
  <input type="hidden" name="__VIEWSTATE" value="fixture-viewstate">
  <input type="hidden" name="__VIEWSTATEGENERATOR" value="fixture-generator">
  <input type="hidden" name="__EVENTVALIDATION" value="fixture-validation">
  <input type="hidden" name="g-recaptcha-response" value="">
  <input name="ctl00$ctl00$MainContent$CustomContentPlaceHolder$txtForeclosureNumber" type="text">
  <input name="ctl00$ctl00$MainContent$CustomContentPlaceHolder$txtGrantorsName" type="text">
  <input name="ctl00$ctl00$MainContent$CustomContentPlaceHolder$txtOwersName" type="text">
  <input name="ctl00$ctl00$MainContent$CustomContentPlaceHolder$txtZipCode" type="text">
  <input name="ctl00$ctl00$MainContent$CustomContentPlaceHolder$txtStreet" type="text">
  <input name="ctl00$ctl00$MainContent$CustomContentPlaceHolder$txtSubdivision" type="text">
  <select name="ctl00$ctl00$MainContent$CustomContentPlaceHolder$ddStatus">
    <option value="" selected></option>
    <option value="NED Recorded">NED Recorded</option>
    <option value="Sold">Sold</option>
    <option value="Withdrawn">Withdrawn</option>
  </select>
  <input name="ctl00$ctl00$MainContent$CustomContentPlaceHolder$txtNedDate1" type="date">
  <input name="ctl00$ctl00$MainContent$CustomContentPlaceHolder$txtNedDate2" type="date">
  <input name="ctl00$ctl00$MainContent$CustomContentPlaceHolder$txtSoldDate1" type="date">
  <input name="ctl00$ctl00$MainContent$CustomContentPlaceHolder$txtSoldDate2" type="date">
  <input name="ctl00$ctl00$MainContent$CustomContentPlaceHolder$txtCurrentScheduledSaleDateFrom" type="date">
  <input name="ctl00$ctl00$MainContent$CustomContentPlaceHolder$txtCurrentScheduledSaleDateTo" type="date">
  <select name="ctl00$ctl00$MainContent$CustomContentPlaceHolder$ddlExpedited">
    <option value="-1" selected></option>
    <option value="0">No</option>
    <option value="1">Yes</option>
  </select>
  <input name="ctl00$ctl00$MainContent$CustomContentPlaceHolder$btnSearch" type="submit" value="Search">
  <input name="ctl00$ctl00$MainContent$CustomContentPlaceHolder$btnShowAll" type="submit" value="Show All">
</form>
</body>
</html>
