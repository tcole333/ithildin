<!DOCTYPE html>
<html>
<head><title>Opinion Search</title></head>
<body>
<form method="post" action="./Default.aspx" id="Form1">
  <input type="hidden" name="__EVENTTARGET" value="">
  <input type="hidden" name="__EVENTARGUMENT" value="">
  <input type="hidden" name="__VIEWSTATE" value="refinement-state">
  <input type="hidden" name="__VIEWSTATEGENERATOR" value="6FF312F1">
  <input name="ctl00$MainContent$tbQueryText" type="text" value="">
  <select name="ctl00$MainContent$ddlCourt">
    <option selected="selected" value="0">Supreme Court of Ohio</option>
    <option value="1">First District Court of Appeals</option>
    <option value="2">Second District Court of Appeals</option>
    <option value="3">Third District Court of Appeals</option>
    <option value="4">Fourth District Court of Appeals</option>
    <option value="5">Fifth District Court of Appeals</option>
    <option value="6">Sixth District Court of Appeals</option>
    <option value="7">Seventh District Court of Appeals</option>
    <option value="8">Eighth District Court of Appeals</option>
    <option value="9">Ninth District Court of Appeals</option>
    <option value="10">Tenth District Court of Appeals</option>
    <option value="11">Eleventh District Court of Appeals</option>
    <option value="12">Twelfth District Court of Appeals</option>
    <option value="13">Court of Claims</option>
    <option value="98">Miscellaneous</option>
    <option value="99">All Sources</option>
    <option value="100">All District Courts</option>
  </select>
  <select name="ctl00$MainContent$ddlDecidedYearMin">
    <option value="2018">2018</option>
    <option selected="selected" value="2026">2026</option>
  </select>
  <select name="ctl00$MainContent$ddlDecidedYearMax">
    <option selected="selected" value="2018">2018</option>
    <option value="2026">2026</option>
  </select>
  <textarea name="ctl00$MainContent$tbYearRangeWarnContent"
    id="MainContent_tbYearRangeWarnContent">The selected 'Year Decided To:' is less than the selected 'Year Decided From:'. Please select a newer year.</textarea>
  <select name="ctl00$MainContent$ddlCounty">
    <option selected="selected" value="0">All counties</option>
    <option value="25">Franklin</option>
    <option value="31">Hamilton</option>
  </select>
  <input name="ctl00$MainContent$tbCaseNumber" type="text" value="">
  <input name="ctl00$MainContent$tbAuthor" type="text" value="">
  <input name="ctl00$MainContent$tbTopics" type="text" value="">
  <input name="ctl00$MainContent$tbWebCiteYear" type="text" value="">
  <input name="ctl00$MainContent$tbWebCiteNumber" type="text" value="">
  <input name="ctl00$MainContent$tbCitation" type="text" value="">
  <span id="MainContent_lblRowCount">This search returned 142 rows.</span>
  <select name="ctl00$MainContent$ddlRowsPerPage">
    <option value="2">2</option>
    <option selected="selected" value="200">200</option>
  </select>

</body>
</html>
