[project]
name = "osint-research"
version = "0.0.0"
description = "Local test/runtime configuration for Ithildin OSINT research workspace."
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.14.3",
  "curl-cffi>=0.13.0",
  "duckdb>=1.4.4",
  "edgartools>=5.25.1",
  "neo4j>=6.1.0",
  "openpyxl>=3.1.5",
  "pandas>=3.0.1",
  "pyarrow>=23.0.1",
  "pydriller>=2.9",
  "pytest>=8.3.5",
  "python-muckrock>=2.3.0",
  "pyyaml>=6.0.3",
  "requests>=2.32.5",
  "truststore>=0.10.4",
  "websockets>=16.0",
  "yfinance>=0.2.36",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
  "integration: integration tests against script/CLI boundaries",
  "real_fixture: tests backed by fixtures derived from real project data",
  "live_data: tests that require live/local large data stores",
  "slow: slower-running tests",
]

[dependency-groups]
dev = [
    "ruff>=0.15.21",
]
