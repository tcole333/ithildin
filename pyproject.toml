[project]
name = "osint-research"
version = "0.0.0"
description = "Local test/runtime configuration for Ithildin OSINT research workspace."
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.4.4",
  "flask>=3.0",
  "maigret>=0.5.0",
  "neo4j>=6.1.0",
  "openpyxl>=3.1.5",
  "pytest>=8.3.5",
  "pyyaml>=6.0.3",
  "rapidfuzz>=3.6",
  "networkx>=2.6",
]

[project.optional-dependencies]
ftm = ["followthemoney>=3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
  "integration: integration tests against script/CLI boundaries",
  "real_fixture: tests backed by fixtures derived from real project data",
  "live_data: tests that require live/local large data stores",
  "slow: slower-running tests",
]
