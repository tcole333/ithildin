version: '3.8'

services:
  neo4j-icij:
    image: neo4j:5.13.0
    container_name: icij-offshore-leaks
    ports:
      - "7689:7687"  # Bolt
      - "7475:7474"  # HTTP Browser
    environment:
      - NEO4J_AUTH=none
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=1G
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - ./data/icij-offshoreleaks-5.13.0.dump:/var/lib/neo4j/import/icij.dump:ro
      - icij-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  icij-data:
